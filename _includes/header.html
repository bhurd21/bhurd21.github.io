<header class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <nav class="max-w-6xl mx-auto px-4 py-4">
    <div class="flex justify-between items-center">
      <a
        href="{{ '/' | relative_url }}"
        class="text-xl font-semibold text-gray-900 hover:text-gray-700"
      >
        {{ site.title }}
      </a>

      {% if page.url == '/' %}
      <a
        href="{{ '/pages/projects/' | relative_url }}"
        class="text-sm md:text-md text-gray-600 hover:text-gray-900 underline decoration-dotted underline-offset-4"
        >Recent Projects ↗</a
      >
      {% endif %}
    </div>
  </nav>
</header>
